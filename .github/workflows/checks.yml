name: Checks

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-build:
    name: Static checks and build (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Static checks
        run: node tools/check.js
      - name: Compile with the .NET Framework 4 compiler
        shell: cmd
        run: tools\build.cmd bin
      - name: The executable exists
        shell: pwsh
        run: |
          $exe = Get-Item bin\HPGMissionCompanion.exe
          "$($exe.Name) $($exe.Length) bytes, version $($exe.VersionInfo.FileVersion)"
